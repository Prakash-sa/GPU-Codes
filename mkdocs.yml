site_name: GPU Codes
site_description: Notes on GPU programming and GPU hardware reference sheets
site_url: https://prakash-sa.github.io/GPU-Codes/
repo_url: https://github.com/Prakash-sa/GPU-Codes
repo_name: Prakash-sa/GPU-Codes
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/external-links.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

exclude_docs: |
  __pycache__/
  trace_*.json

nav:
  - Home: index.md
  - GPU spec sheets: gpu-spec-sheets.md
  - GPU programming notes:
      - Overview: notes/index.md
      - 1. Execution model: notes/01-execution-model.md
      - 2. Memory hierarchy: notes/02-memory-hierarchy.md
      - 3. Performance optimization: notes/03-performance.md
      - 4. Streams and concurrency: notes/04-streams.md
      - 5. Multi-GPU and NCCL: notes/05-multi-gpu.md
      - 6. Profiling and debugging: notes/06-profiling.md
      - 7. GPU from Python: notes/07-python.md
      - 8. Programming with Triton: notes/08-triton.md
      - 9. Optimization strategies: notes/09-optimization-strategies.md
      - Cheat sheet: notes/cheatsheet.md
  - LeetGPU solutions (Triton):
      - Overview: leetgpu/index.md
      - Benchmark, profile, scale: leetgpu/benchmarking.md
      - 01. Vector addition: leetgpu/01-vector-add.md
      - 02. Matrix transpose: leetgpu/02-matrix-transpose.md
      - 03. Reduction: leetgpu/03-reduction.md
      - 04. Dot product: leetgpu/04-dot-product.md
      - 05. Softmax: leetgpu/05-softmax.md
      - 06. RMS normalization: leetgpu/06-rms-norm.md
      - 07. Layer normalization: leetgpu/07-layer-norm.md
      - 08. Fused residual + RMSNorm: leetgpu/08-fused-residual-rms-norm.md
      - 09. GEMM: leetgpu/09-gemm.md
      - 10. FP16 batched matmul: leetgpu/10-fp16-batched-matmul.md
      - 11. Scatter add: leetgpu/11-scatter-add.md
      - 12. Nearest neighbor: leetgpu/12-nearest-neighbor.md
      - 13. N-body force: leetgpu/13-n-body-force.md
      - 14. 2D Jacobi stencil: leetgpu/14-jacobi-stencil-2d.md
      - 15. Sparse x dense matmul: leetgpu/15-spmm.md
      - 16. Segmented prefix sum: leetgpu/16-segmented-prefix-sum.md
      - 17. LayerNorm + Linear + GELU: leetgpu/17-fused-layernorm-linear-gelu.md
      - 18. Softmax attention: leetgpu/18-softmax-attention.md
      - 19. RMSNorm backward: leetgpu/19-rms-norm-backward.md
      - 20. LayerNorm backward: leetgpu/20-layer-norm-backward.md
